function calendarPage(){let base=new Date();base=new Date(base.getFullYear(),base.getMonth()+calendarOffset,1);const yy=base.getFullYear(),mm=base.getMonth();const first=(base.getDay()+6)%7,last=new Date(yy,mm+1,0).getDate();let cells=Array.from({length:first},()=>'<div class="cal-day muted"></div>');for(let d=1;d<=last;d++){let date=[yy,String(mm+1).padStart(2,'0'),String(d).padStart(2,'0')].join('-');let tasks=state.tasks.filter(t=>t.date===date),shifts=state.shifts.filter(x=>x.date===date);cells.push(`<div class="cal-day ${date===today()?'current':''}"><div class="day-number">${d}</div>${tasks.slice(0,3).map(t=>`<button class="cal-event ${t.status==='done'?'isdone':''}" onclick="taskModal('${t.id}')">${esc(t.title)}</button>`).join('')}${tasks.length>3?`<small>+${tasks.length-3} задач</small>`:''}${shifts.length?`<small class="cal-shift">☕ ${shifts.length} смен</small>`:''}</div>`)}return header('Планирование','Календарь','Задачи по срокам и количество запланированных смен.',`<button class="btn primary" onclick="taskModal()">+ Задача</button>`)+panel('Месяц',`<div class="cal-top"><button class="btn" onclick="calendarOffset--;render()">←</button><b>${base.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button class="btn" onclick="calendarOffset++;render()">→</button><button class="small-btn" onclick="calendarOffset=0;render()">Сегодня</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-label">${x}</div>`).join('')}${cells.join('')}</div><p class="muted" style="font-size:12px">Нажмите на задачу в календаре, чтобы изменить её. Смены показаны количеством записей на день.</p>`)}

function supplierPage(){let sorted=[...state.suppliers].sort((a,b)=>a.vendor.localeCompare(b.vendor,'ru'));return header('Закупки','Прайсы поставщиков','Единый справочник товаров, цен и контактов.',`<button class="btn primary" onclick="supplierModal()">+ Добавить позицию</button>`)+panel('Каталог закупок',sorted.length?`<div class="table-wrap"><table><thead><tr><th>Поставщик</th><th>Товар</th><th>Ед.</th><th>Цена</th><th>Контакт / примечание</th><th></th></tr></thead><tbody>${sorted.map(s=>`<tr><td><b>${esc(s.vendor)}</b></td><td>${esc(s.item)}</td><td>${esc(s.unit)||'—'}</td><td>${formatMoney(s.price)}</td><td>${esc(s.contact)||'—'}</td><td><button class="small-btn" onclick="supplierModal('${s.id}')">Изменить</button><button class="small-btn danger" onclick="removeItem('suppliers','${s.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Список пуст. Добавьте товар и поставщика.</div>`)}
function filesPage(){let files=state.files;return header('База знаний','Документы и таблицы','Храните импортированные файлы и просматривайте табличные данные.',`<button class="btn primary" onclick="chooseFiles()">+ Загрузить файлы</button>`)+`<div class="notice"><b>Как это работает:</b> CSV и TSV можно просмотреть как таблицы. JSON и TXT отображаются как текст; PDF и изображения можно открыть внутри приложения. Excel (.xlsx) сохраняется как файл, но для анализа лист пока нужно экспортировать в CSV. Все данные этой версии лежат локально в браузере и не синхронизируются между устройствами. Регулярно создавайте резервную копию.</div>`+panel('Импорт документов',`<div class="drop" id="drop"><strong>Перетащите сюда файлы</strong><p>CSV · TSV · JSON · PDF · XLSX · изображения и другие документы</p><button class="btn" onclick="chooseFiles()">Выбрать файлы</button></div>`)+panel(`Хранилище (${files.length})`,files.length?`<div class="file-list">${files.map(f=>`<div class="file-row"><div><b>${esc(f.name)}</b><div><small>${esc(f.type||'Файл')} · ${Math.max(1,Math.round(f.size/1024))} КБ · ${new Date(f.created).toLocaleDateString('ru-RU')}</small></div></div><div class="actions"><button class="small-btn" onclick="previewFile('${f.id}')">Открыть</button><button class="small-btn" onclick="downloadFile('${f.id}')">Скачать</button><button class="small-btn danger" onclick="removeItem('files','${f.id}')">×</button></div></div>`).join('')}</div>`:`<div class="empty">Загруженные материалы появятся здесь.</div>`)}
function render(){nav();document.getElementById('main').innerHTML=({home:dashboard,tasks:tasksPage,calendar:calendarPage,shifts:shiftPage,suppliers:supplierPage,files:filesPage})[view]()+`<div class="actions" style="justify-content:flex-end;margin-top:24px"><button class="btn" onclick="exportData()">⇩ Резервная копия JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">⇧ Восстановить данные</button></div><p class="nav-note">Meren Coffee · прототип 0.2 · сохраняет изменения автоматически на этом устройстве</p>`;if(view==='files')bindDrop()}
function modal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function field(name,label,val='',type='text',required=false){return `<label>${label}<input class="field" name="${name}" type="${type}" value="${esc(val)}" ${required?'required':''}></label>`}function selectField(name,label,val,options){return `<label>${label}<select class="field" name="${name}">${options.map(([v,n])=>`<option value="${v}" ${val===v?'selected':''}>${n}</option>`).join('')}</select></label>`}
function taskModal(id){let t=state.tasks.find(x=>x.id===id)||{title:'',note:'',owner:'',date:'',category:'Операционка',priority:'normal',status:'todo'};modal(id?'Изменить задачу':'Новая задача',`<form onsubmit="saveForm(event,'tasks','${id||''}')"><div class="formgrid"> <div class="wide">${field('title','Название',t.title,'text',true)}</div>${field('date','Срок',t.date,'date')}${field('owner','Ответственный',t.owner)}${selectField('category','Категория',t.category||'Операционка',[['Операционка','Операционка'],['Команда','Команда'],['Закупки','Закупки'],['Финансы','Финансы'],['Маркетинг','Маркетинг'],['Другое','Другое']])}${selectField('priority','Приоритет',t.priority,[['urgent','Срочно'],['high','Высокий'],['normal','Обычный'],['low','Низкий']])}${selectField('status','Статус',t.status,[['todo','К выполнению'],['progress','В работе'],['done','Готово']])}<label class="wide">Комментарий<textarea name="note" class="field">${esc(t.note)}</textarea></label></div><div class="modal-foot"><button class="btn" type="button" onclick="closeModal()">Отмена</button><button class="btn primary">Сохранить</button></div></form>`)}
function quickAdd(e){e.preventDefault();const title=e.target.elements.title.value.trim();if(!title)return;state.tasks.unshift({id:uid(),title,status:'todo',priority:'normal',owner:'',date:'',note:'',category:'Операционка'});save();render()}function shiftModal(id){let s=state.shifts.find(x=>x.id===id)||{employee:'',date:today(),from:'09:00',to:'21:00',role:''};modal(id?'Изменить смену':'Новая смена',`<form onsubmit="saveForm(event,'shifts','${id||''}')"><div class="formgrid">${field('employee','Сотрудник',s.employee,'text',true)}${field('date','Дата',s.date,'date',true)}${field('from','С',s.from,'time',true)}${field('to','До',s.to,'time',true)}<div class="wide">${field('role','Роль / примечание',s.role)}</div></div><div class="modal-foot"><button class="btn" type="button" onclick="closeModal()">Отмена</button><button class="btn primary">Сохранить</button></div></form>`)}
function supplierModal(id){let s=state.suppliers.find(x=>x.id===id)||{vendor:'',item:'',unit:'шт.',price:'',contact:''};modal(id?'Изменить позицию':'Новая позиция',`<form onsubmit="saveForm(event,'suppliers','${id||''}')"><div class="formgrid">${field('vendor','Поставщик',s.vendor,'text',true)}${field('item','Товар',s.item,'text',true)}${field('unit','Ед. измерения',s.unit)}${field('price','Цена, ₽',s.price,'number')}<div class="wide">${field('contact','Контакт / примечание',s.contact)}</div></div><div class="modal-foot"><button class="btn" type="button" onclick="closeModal()">Отмена</button><button class="btn primary">Сохранить</button></div></form>`)}
function saveForm(e,key,id){e.preventDefault();const values=Object.fromEntries(new FormData(e.target).entries());if(key==='suppliers')values.price=values.price===''?'':Number(values.price);if(id){let index=state[key].findIndex(x=>x.id===id);if(index>=0)state[key][index]={...state[key][index],...values}}else state[key].push({...values,id:uid()});save();closeModal();render()}function removeItem(key,id){if(!confirm('Удалить эту запись?'))return;state[key]=state[key].filter(x=>x.id!==id);save();render()}function setStatus(id,status){let t=state.tasks.find(x=>x.id===id);if(t){t.status=status;save();render()}}
function chooseFiles(){document.getElementById('importFile').click()}function bindDrop(){let drop=document.getElementById('drop');if(!drop)return;drop.ondragover=e=>{e.preventDefault();drop.style.background='#e5f1e7'};drop.ondragleave=()=>drop.style.background='';drop.ondrop=e=>{e.preventDefault();drop.style.background='';importFiles(e.dataTransfer.files)}}
function importFiles(list){let arr=[...list];if(!arr.length)return;let done=0;arr.forEach(file=>{if(file.size>3*1024*1024){alert('Файл '+file.name+' больше 3 МБ. В этой версии для него недостаточно места в локальном хранилище.');if(++done===arr.length)render();return}let reader=new FileReader();reader.onload=()=>{state.files.push({id:uid(),name:file.name,type:file.type||'application/octet-stream',size:file.size,created:new Date().toISOString(),data:reader.result});if(++done===arr.length){save();render()}};reader.onerror=()=>{alert('Не удалось прочитать '+file.name);if(++done===arr.length)render()};reader.readAsDataURL(file)})}
document.getElementById('importFile').addEventListener('change',e=>{importFiles(e.target.files);e.target.value='' });function getFile(id){return state.files.find(f=>f.id===id)}function downloadFile(id){let f=getFile(id);if(!f)return;const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}function decodeFile(f){let b64=f.data.split(',')[1];let str=atob(b64),bytes=Uint8Array.from(str,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes).replace(/^\uFEFF/,'')}
function parseCSV(raw,sep){let out=[],row=[],value='',quoted=false;for(let i=0;i<raw.length;i++){let c=raw[i];if(c==='"'){if(quoted&&raw[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(value);if(row.some(v=>v!==''))out.push(row);row=[];value=''}else value+=c}row.push(value);if(row.some(v=>v!==''))out.push(row);return out}
function previewFile(id){let f=getFile(id);if(!f)return;let name=f.name.toLowerCase(),content='';if(/\.(csv|tsv)$/.test(name)){let txt=decodeFile(f),first=txt.split('\n')[0],sep=name.endsWith('.tsv')?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');let rows=parseCSV(txt,sep).slice(0,150);content=`<p class="muted">Предпросмотр первых 150 строк · ${rows.length} строк показано</p><div class="file-preview"><table>${rows.map((r,i)=>`<tr>${r.map(v=>i===0?`<th>${esc(v)}</th>`:`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`}else if(/\.(json|txt)$/.test(name)){content=`<pre style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;font-size:12px">${esc(decodeFile(f).slice(0,40000))}</pre>`}else if(/^image\//.test(f.type)){content=`<img alt="Файл" src="${f.data}" style="max-width:100%;max-height:65vh">`}else if(f.type==='application/pdf'||name.endsWith('.pdf')){content=`<iframe title="PDF" src="${f.data}" style="width:100%;height:55vh;border:0"></iframe>`}else{content='<p>Предпросмотр для этого формата недоступен. Скачайте файл, чтобы открыть его в подходящей программе.</p>'}modal(f.name,`${content}<div class="modal-foot"><button class="btn" onclick="closeModal()">Закрыть</button><button class="btn primary" onclick="downloadFile('${f.id}')">Скачать</button></div>`)}
function exportData(){const data=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download=`meren-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('restoreFile').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.shifts)||!Array.isArray(x.suppliers)||!Array.isArray(x.files))throw new Error('Неверный формат');if(confirm('Заменить текущие данные данными из резервной копии?')){state={tasks:x.tasks,shifts:x.shifts,suppliers:x.suppliers,files:x.files};save();render()}}catch(err){alert('Не удалось восстановить: '+err.message)}};reader.readAsText(file);e.target.value=''});save();render();
</script><script>
// Meren OS 0.3 — visual layer and workflow overrides
let scheduleOffset=0,chosenShiftDate=today(),priceQuery='',priceCategory='Все',priceUploadCategory='Бар',shiftImportPreview=null,priceImportPreview=null;
const roleNames=['Бариста','Кухня','Мойщица','Менеджер','Другое'];
function roleType(s){let v=String(s||'').toLowerCase();return v.includes('бар')?'bar':v.includes('кух')||v.includes('повар')?'kitchen':v.includes('мой')||v.includes('посуд')?'wash':v.includes('менедж')||v.includes('управ')?'manager':'other'}
function roleTag(r){return `<span class="role role-${roleType(r)}">${esc(r||'Другое')}</span>`}
function nav(){document.getElementById('nav').innerHTML=tabs.filter(x=>x[0]!=='calendar').map(([key,ico,name])=>`<button class="${key===view?'active':''}" onclick="navigate('${key}')"><span class="ico">${ico}</span><span>${name}</span></button>`).join('')}
function header(tag,title,desc,buttons=''){return `<div class="top"><div><div class="eyebrow">${tag}</div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div><div class="actions">${buttons}</div></div>`}
function heroVisual(pendingCount,tomorrowCount,lateCount,tomorrowLabel){const now=new Date();const todayShort=now.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});return `<div class="hero-ambient" aria-hidden="true"><span class="hero-ribbon r1"></span><span class="hero-ribbon r2"></span><span class="hero-ribbon r3"></span><span class="hero-glow"></span><span class="hero-orb-core"></span><span class="hero-shine"></span><div class="hero-card c1"><small>Сегодня</small><b>${todayShort}</b><span>Рабочий ритм</span></div><div class="hero-card c2"><small>Сотрудников</small><b>${tomorrowCount}</b><span>на ${tomorrowLabel}</span></div><div class="hero-card c3"><small>В работе</small><b>${pendingCount}</b><span>активных задач</span></div></div>`}
function dashboard(){const pending=state.tasks.filter(t=>t.status!=='done'),late=pending.filter(t=>t.date&&t.date<today());const important=pending.filter(t=>['high','urgent'].includes(t.priority)).length;const todayTeam=new Set(state.shifts.filter(s=>s.date===today()).map(s=>String(s.employee||'').trim().toLocaleLowerCase('ru-RU')).filter(Boolean)).size;const nextDay=new Date();nextDay.setDate(nextDay.getDate()+1);const tomorrow=[nextDay.getFullYear(),String(nextDay.getMonth()+1).padStart(2,'0'),String(nextDay.getDate()).padStart(2,'0')].join('-');const tomorrowLabel=nextDay.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});let nearest=state.shifts.filter(s=>s.date===tomorrow).sort((a,b)=>a.from.localeCompare(b.from));return header('','Мой рабочий стол','')+`<div class="home-hero"><div class="hero-copy"><span class="hero-kicker">В фокусе</span><h3>Всё важное — под рукой</h3><p>Задачи, команда и документы в одном ритме. Выбирайте, что требует внимания сегодня.</p><div class="hero-meta"><span class="hero-pill"><b>${important}</b> важных задач</span><span class="hero-pill"><b>${todayTeam}</b> сотрудников сегодня</span><span class="hero-pill"><b>${late.length}</b> просроченных задач</span></div></div>${heroVisual(pending.length,new Set(nearest.map(s=>String(s.employee||'').trim().toLocaleLowerCase('ru-RU')).filter(Boolean)).size,late.length,tomorrowLabel)}</div><form class="capture" onsubmit="quickAdd(event)"><span class="capture-icon">☕</span><input class="field" name="title" required maxlength="180" placeholder="Что нужно сделать?"><button class="btn primary">Добавить ↗</button></form><div class="two home-grid"><div>${panel('Мои задачи',taskTable(pending,7),`<button class="small-btn" onclick="navigate('tasks')">Все задачи ↗</button>`)}</div><div>${panel(`Завтра · ${niceDate(tomorrow)}`,nearest.length?`<div class="shift-stack">${nearest.map(s=>`<button class="shift-person" onclick="shiftModal('${s.id}')"><span class="shift-avatar role-${roleType(s.role)}">${esc(s.employee.slice(0,1).toUpperCase())}</span><span class="shift-info"><b>${esc(s.employee)}</b>${roleTag(s.role)}</span><strong>${esc(s.from)}–${esc(s.to)}</strong></button>`).join('')}</div>`:'<div class="empty short">На завтра смены пока не загружены.</div>',`<button class="small-btn" onclick="navigate('shifts')">Весь график ↗</button>`)}${panel('Быстрый доступ',`<div class="home-shortcuts"><button onclick="navigate('shifts')"><span>▦</span>График сотрудников ↗</button><button onclick="navigate('suppliers')"><span>◈</span>Поиск в прайсах ↗</button><button onclick="navigate('files')"><span>▤</span>Документы ↗</button></div>`)}</div></div>`}

/* Restored two-week schedule calendar and editing workflows */
function roleLegend(){return `<div class="role-legend">${['Бариста','Кухня','Мойщица','Менеджер'].map(roleTag).join('')}</div>`}
function shiftPage(){let base=new Date();base=new Date(base.getFullYear(),base.getMonth()+scheduleOffset,1);let year=base.getFullYear(),month=base.getMonth(),num=new Date(year,month+1,0).getDate(),first=(base.getDay()+6)%7,cells=Array(first).fill('<div class="shift-cal-day muted-day"></div>');for(let d=1;d<=num;d++){let date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let shifts=state.shifts.filter(s=>s.date===date).sort((a,b)=>a.from.localeCompare(b.from));cells.push(`<button class="shift-cal-day ${date===today()?'today-day':''} ${date===chosenShiftDate?'selected-day':''}" onclick="chosenShiftDate='${date}';render()"><span class="day-num">${d}</span><span class="day-events">${shifts.slice(0,4).map(s=>`<span class="tiny-shift role-${roleType(s.role)}">${esc(s.employee)} <small>${esc(s.from)}</small></span>`).join('')}${shifts.length>4?`<small class="more-shifts">+${shifts.length-4}</small>`:''}</span></button>`)}let selected=state.shifts.filter(s=>s.date===chosenShiftDate).sort((a,b)=>a.from.localeCompare(b.from));return header('КОМАНДА','График сотрудников','',`<button class="btn" onclick="openShiftImport()">↑ Загрузить график</button><button class="btn primary" onclick="shiftModal()">＋ Смена</button>`)+`<div class="schedule-layout"><section class="panel schedule-panel"><div class="cal-top"><button class="btn icon-btn" onclick="scheduleOffset--;render()">‹</button><b>${base.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button class="btn icon-btn" onclick="scheduleOffset++;render()">›</button><button class="small-btn" onclick="scheduleOffset=0;chosenShiftDate=today();render()">Сегодня</button></div>${roleLegend()}<div class="shift-calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-label">${x}</div>`).join('')}${cells.join('')}</div></section><section class="panel day-panel"><div class="panel-head"><div><div class="eyebrow">СОСТАВ СМЕНЫ</div><h3>${niceDate(chosenShiftDate)}</h3></div><button class="small-btn" onclick="shiftModalForDay()">＋</button></div>${selected.length?`<div class="shift-stack">${selected.map(s=>`<div class="shift-person"><span class="shift-avatar role-${roleType(s.role)}">${esc(s.employee.slice(0,1).toUpperCase())}</span><span class="shift-info"><b>${esc(s.employee)}</b>${roleTag(s.role)}</span><span class="shift-time">${esc(s.from)}–${esc(s.to)}</span><button class="small-btn" onclick="shiftModal('${s.id}')" title="Изменить">✎</button><button class="small-btn danger" onclick="removeItem('shifts','${s.id}')" title="Удалить">×</button></div>`).join('')}</div>`:'<div class="empty short">На этот день смен нет.</div>'}</section></div>`}
function shiftModalForDay(){shiftModal();let input=document.querySelector('#modalBody [name="date"]');if(input)input.value=chosenShiftDate}
function shiftModal(id){let s=state.shifts.find(x=>x.id===id)||{employee:'',date:chosenShiftDate||today(),from:'09:00',to:'21:00',role:'Бариста'};modal(id?'Изменить смену':'Новая смена',`<form onsubmit="saveForm(event,'shifts','${id||''}')"><div class="formgrid">${field('employee','Сотрудник',s.employee,'text',true)}${field('date','Дата',s.date,'date',true)}${field('from','С',s.from,'time',true)}${field('to','До',s.to,'time',true)}${selectField('role','Должность',s.role,roleNames.map(x=>[x,x]))}</div><div class="modal-foot"><button class="btn" type="button" onclick="closeModal()">Отмена</button><button class="btn primary">Сохранить смену</button></div></form>`)}

function render(){nav();const pages={home:dashboard,tasks:tasksPage,calendar:calendarPage,shifts:shiftPage,suppliers:supplierPage,files:filesPage};document.getElementById('main').innerHTML=pages[view]();if(view==='files')bindDrop()}
function openSettings(){modal('Настройки и данные',`<div class="settings-options"><p>Задачи, смены, прайсы и небольшие документы сохраняются в вашей облачной базе. Изменения с другого устройства появляются после синхронизации.</p><button class="btn" onclick="exportData()">↓ Скачать резервную копию JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">↑ Восстановить из копии</button></div>`)}
// Import spreadsheets. CSV works offline; XLSX requires the SheetJS library to load.
async function readSpreadsheet(file){let n=file.name.toLowerCase();if(/\.csv$|\.tsv$/.test(n)){let txt=await file.text();let line=txt.split(/\r?\n/)[0]||'',sep=n.endsWith('.tsv')?'\t':([';',',','\t'].sort((a,b)=>(line.split(b).length)-(line.split(a).length))[0]);return parseCSV(txt,sep)}if(/\.xlsx$|\.xls$/.test(n)){if(!window.XLSX){try{await loadXLSX()}catch(e){throw new Error('Для импорта Excel требуется интернет. Или сохраните таблицу в CSV и загрузите её без интернета.')}}let buf=await file.arrayBuffer();let wb=XLSX.read(buf,{type:'array',cellDates:true});if(!wb.SheetNames.length)throw new Error('В файле нет листов');return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}throw new Error('Выберите CSV, TSV или Excel (.xlsx, .xls)')}
function loadXLSX(){return new Promise((resolve,reject)=>{if(window.XLSX)return resolve();let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)})}
function csvOptions(headers,preferred){return `<option value="-1">Не использовать</option>`+headers.map((h,i)=>`<option value="${i}" ${preferred===i?'selected':''}>${esc(h||'Столбец '+(i+1))}</option>`).join('')}
function guessColumn(headers,words){return headers.findIndex(h=>words.some(w=>String(h).toLowerCase().includes(w)))}
function mappingField(field,label,headers,words,required=false){let idx=guessColumn(headers,words);return `<label>${label}${required?' *':''}<select class="field" name="${field}">${csvOptions(headers,idx)}</select></label>`}
function sanitizeSheet(rows){return rows.filter(r=>Array.isArray(r)&&r.some(c=>String(c??'').trim())).slice(0,10000)}
function openShiftImport(){modal('Импорт графика',`<p class="muted">Загрузите график смен на две недели в CSV или Excel. Одна строка — один сотрудник в одну дату.</p><p class="muted">Нужные столбцы: дата, сотрудник, начало, конец, должность. Перед сохранением сопоставим их с колонками файла.</p><input class="field" type="file" accept=".csv,.tsv,.xlsx,.xls" onchange="prepareImport(event,'shift')"><div id="importMapping"></div>`)}
function openPriceImport(){modal('Импорт прайса',`<p class="muted">Загрузите прайс таблицей. Все товары добавятся сразу — вручную переписывать позиции не нужно.</p><label>Раздел<select id="importCategory" class="field"><option>Бар</option><option>Кухня</option><option>Хозка</option><option>Другое</option></select></label><input class="field" style="margin-top:14px;max-width:100%" type="file" accept=".csv,.tsv,.xlsx,.xls" onchange="prepareImport(event,'price')"><div id="importMapping"></div>`)}
async function prepareImport(e,type){let f=e.target.files[0];if(!f)return;let target=document.getElementById('importMapping');target.innerHTML='<p>Читаем таблицу…</p>';try{let rows=sanitizeSheet(await readSpreadsheet(f));if(rows.length<2)throw new Error('В таблице нужно минимум две строки: заголовки и данные');let headers=rows[0].map(String),data=rows.slice(1);if(type==='shift')shiftImportPreview={headers,data};else priceImportPreview={headers,data};let fields=type==='shift'?[
['date','Дата',['дата','date','день'],true],['employee','Сотрудник',['сотруд','фио','имя','employee','фамилия'],true],['from','Начало',['начало','с ','start','от','приход'],true],['to','Конец',['конец','до','end','уход'],true],['role','Должность',['должн','роль','role','позиция'],false]
]:[['item','Товар',['товар','наимен','продукт','ингредиент','item'],true],['price','Цена',['цена','стоим','price','закуп'],true],['vendor','Поставщик',['постав','vendor','supplier'],false],['unit','Единица',['ед.','единиц','фасов','unit'],false]];
target.innerHTML=`<div class="import-mapping"><h4>Сопоставьте столбцы</h4><p class="muted">Строк к импорту: ${data.length}. Пример: ${esc(data[0].slice(0,5).join(' · ').slice(0,180))}</p><form onsubmit="commitImport(event,'${type}')"><div class="formgrid">${fields.map(([key,label,words,req])=>mappingField(key,label,headers,words,req)).join('')}${type==='price'?`<div class="wide">${field('fallbackVendor','Название поставщика (если нет столбца)',f.name.replace(/\.[^.]+$/,''))}</div>`:''}</div><div class="modal-foot"><button class="btn" type="button" onclick="closeModal()">Отмена</button><button class="btn primary">Импортировать ${data.length} строк</button></div></form></div>`}catch(err){target.innerHTML=`<p class="import-error">${esc(err.message)}</p>`}}
function normDate(v){let s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);if(m){let y=Number(m[3]);if(y<100)y+=2000;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function normTime(v){let s=String(v||'').trim().replace('.',':');if(/^\d{1,2}:\d{2}/.test(s)){let [h,m]=s.split(':');return h.padStart(2,'0')+':'+m.slice(0,2)}if(/^\d{1,2}$/.test(s))return s.padStart(2,'0')+':00';return ''}
function commitImport(e,type){e.preventDefault();let f=new FormData(e.target),rowdata=type==='shift'?shiftImportPreview:priceImportPreview;if(!rowdata)return;let get=(row,key)=>{let i=Number(f.get(key));return i<0?'':String(row[i]??'').trim()};let records=[],skipped=0;for(let row of rowdata.data){if(type==='shift'){let date=normDate(get(row,'date')),employee=get(row,'employee'),from=normTime(get(row,'from')),to=normTime(get(row,'to')),role=get(row,'role')||'Другое';if(!date||!employee||!from||!to){skipped++;continue}records.push({id:uid(),date,employee,from,to,role})}else{let item=get(row,'item'),raw=get(row,'price').replace(/\s/g,'').replace(',','.').replace(/[^0-9.\-]/g,''),price=raw?Number(raw):'',vendor=get(row,'vendor')||String(f.get('fallbackVendor')||''),unit=get(row,'unit');if(!item||price===''||!Number.isFinite(price)){skipped++;continue}records.push({id:uid(),item,price,vendor,unit,contact:'',category:document.getElementById('importCategory')?.value||'Бар'})}}
if(!records.length){alert('Не найдено подходящих строк. Проверьте сопоставление колонок и формат данных.');return}
if(type==='shift'){let duplicates=new Set(records.map(s=>`${s.date}|${s.employee.toLowerCase()}|${s.from}|${s.to}`));state.shifts=state.shifts.filter(s=>!duplicates.has(`${s.date}|${s.employee.toLowerCase()}|${s.from}|${s.to}`));state.shifts.push(...records);if(records[0]){chosenShiftDate=records[0].date;let d=new Date(chosenShiftDate+'T12:00:00'),now=new Date();scheduleOffset=(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth()}view='shifts'}else{state.suppliers.push(...records);view='suppliers'}save();closeModal();render();alert(`Импортировано: ${records.length}. Пропущено строк: ${skipped}.`)}
// preserve originals but remove incidental version text and excessive metadata
render();
</script><script src="cloud.js"></script></body></html>
